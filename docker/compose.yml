# A local Snipe-IT for the demo (Snipe-IT's own compose file, pinned, on port 8088). Settings in docker/.env,
# written by scripts/up.sh. Nothing here is reachable from outside this machine.
name: snipeit-demo

volumes:
  db_data:
  storage:

services:
  app:
    image: snipe/snipe-it:v8.8.3
    restart: unless-stopped
    volumes:
      - storage:/var/lib/snipeit
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env

  db:
    image: mariadb:11.4.7
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 1s
      retries: 10
